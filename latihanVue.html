<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan Prasyarat Vue: Kasir Mini</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 2rem; width: 100%; max-width: 550px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h1 { margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid #334155; padding-bottom: 0.75rem; }
    .form-group { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: 0.6rem 0.8rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    input:focus { outline: 2px solid #38bdf8; }
    button.btn-add { background: #0284c7; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button.btn-add:hover { background: #0369a1; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #334155; margin-bottom: 0.5rem; padding: 0.75rem 1rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; user-select: none; }
    .badge-pending { background: #eab308; color: #000; }
    .badge-selesai { background: #22c55e; color: #000; }
    .btn-del { background: #ef4444; color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 0.5rem; }
    .btn-del:hover { background: #dc2626; }
    .footer-info { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #334155; font-size: 0.9rem; color: #94a3b8; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Pesanan Warung Kopi</h1>

    <!-- FORM INPUT -->
    <div class="form-group">
      <input type="text" id="inputMenu" placeholder="Nama menu..." />
      <input type="number" id="inputHarga" placeholder="Harga (Rp)..." />
      <button class="btn-add" onclick="tambahMenu()">+ Tambah</button>
    </div>

    <!-- DAFTAR ITEM YANG AKAN DIGAMBAR OLEH RENDER() -->
    <ul id="daftarPesanan"></ul>

    <!-- TOTAL STATISTIK -->
    <div class="footer-info">
      <span>Total Pesanan: <b id="totalItem">0</b></span>
      <span>Total Pendapatan: <b id="totalHarga">Rp 0</b></span>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. STATE (Sumber Kebenaran Tunggal di Memori)
    // =========================================================================
    let pesananList = [
      { id: 1, menu: "Kopi Tubruk", harga: 10000, status: "Pending" },
      { id: 2, menu: "Roti Bakar",  harga: 15000, status: "Selesai" }
    ];

    // =========================================================================
    // 2. FUNGSI RENDER (Penggambar Layar Manual)
    // Tugas: Baca pesananList -> rakit string HTML -> tempel ke #daftarPesanan
    // =========================================================================
    function render() {
      const container = document.getElementById("daftarPesanan");
      const totalItemEl = document.getElementById("totalItem");
      const totalHargaEl = document.getElementById("totalHarga");

     

        

      // TODO A:
      // Gunakan pesananList.map(...) untuk menghasilkan deretan tag <li>...</li>
      // Pasang onclick="ubahStatus(${item.id})" pada tombol status 
      // Pasang onclick="hapusMenu(${item.id})" pada tombol hapus
      // Gabungkan hasil map dengan .join("") lalu masukkan ke container.innerHTML
      container.innerHTML = pesananList.map(item => `
      <li>
        <div>
          <b>${item.menu} <b> - RP ${item.harga.toLocaleString()}
          <div>
            <div>
              <span class = "badge ${item.status === 'Selesai' ? 'badge-selesai' : 'badge-pending'}"
              onclick = "ubahStatus (${item.id})" >
              ${item.status}
               </span>
               <button class = "btn-del" onclick = "hapusMenu(${item.id})">Hapus</button>
                   </div>
             </div>
              </div>
        <li>
        `).join("");
        
        addEventListener("click", () => {
          ubahStatus.textContent = 'test'
        })
      // TODO B:
      // Hitung total item (pesananList.length)
      // Hitung akumulasi total harga 
      // PANGGIL ID totalItem
      totalItemEl.textContent = pesananList.length // gblk butuh 30 menit baru kepikirrrr
        totalHargaEl.textContent = pesananList.map(item => item.harga).reduce((sum, harga) => sum + harga,0) // nyontek dari ai dulu pake konsep let total = pesananList.map(item => item.harga).reduce(( Tapi gw ubah dia ga pake let. Karena gw tau Let mutlak dilarang oleh const karenan konstan (16 menit terbuang buat cari tau ternyata solusi nya chain method)
        // agak brengsek logika nya tapi memang itu aturan JS dalam melakukan .reduce, Sebab sum di declare sebagai sum = 0 dari awal jadi mengikuti iterasi sesuai indeksd harga
          

      
    }

    // =========================================================================
    // 3. FUNGSI AKSI: TAMBAH DATA (CREATE)
    // =========================================================================
    function tambahMenu() {
      const menuInput = document.getElementById("inputMenu");
      const hargaInput = document.getElementById("inputHarga");

      // TODO C:
      // 1. Ambil nilai menuInput.value dan Number(hargaInput.value)
      // 2. Buat objek baru: { id: Date.now(), menu: ..., harga: ..., status: "Pending" }
      // 3. Masukkan ke pesananList menggunakan SPREAD OPERATOR
      // 4. Kosongkan input kembali
      // 5. PANGGIL render()

      const namaMenu = menuInput.value
      const harga = Number(hargaInput.value)

       const itemBaru = {
    id: Date.now(), 
    menu: namaMenu,   // BENAR: Menggunakan string nama menu
    harga: harga,     // BENAR: Menggunakan angka harga
    status: "Pending"
  };

      pesananList = [... pesananList, itemBaru];
      menuInput.value = "";
      hargaInput.value = "";

       render()
      
    }
   

    // =========================================================================
    // 4. FUNGSI AKSI: UBAH STATUS (UPDATE via .map)
    // =========================================================================
    function ubahStatus(id) {
      // TODO D:
      // 1. Gunakan pesananList.map(...)
      // 2. Jika item.id === id, balik statusnya: Pending -> Selesai atau Selesai -> Pending
      // 3. PANGGIL render()
      pesananList = pesananList.map(item => {
        if (item.id === id) {
          const newStatus = item.status === "Pending" ? "Selesai" : "Pending";
          return {...item , status: newStatus}
        }
        return item
      })

      render();

    }

    // =========================================================================
    // 5. FUNGSI AKSI: HAPUS DATA (DELETE via .filter)
    // =========================================================================
    function hapusMenu(id) {
      // TODO E:
      // 1. Gunakan pesananList.filter(...) untuk menyingkirkan item dengan id ini
      // 2. PANGGIL render()
      pesananList = pesananList.filter(item=> item.id !==id)
      render();
    }

    // Eksekusi render pertama kali saat browser dibuka
    render();
  </script>
</body>
</html>
